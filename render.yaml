# Render blueprint for the DisruptionOps API (Docker).
#
# New service: Render dashboard → New → Blueprint → pick this repo. Render reads
# this file, builds backend/Dockerfile from the repo root, and asks for every
# `sync: false` value (secrets are never stored in git).

services:
  - type: web
    name: disruptionops-api
    runtime: docker
    region: singapore            # closest to the Supabase ap-northeast-2 / India users
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # ---- database ---------------------------------------------------------
      # Supabase *transaction pooler* string (port 6543), not the direct 5432 one.
      - key: DATABASE_URL
        sync: false

      # ---- model (Gemini) ---------------------------------------------------
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

      # ---- CORS -------------------------------------------------------------
      # Deployed frontend origins, comma-separated, no trailing slash.
      - key: ALLOWED_ORIGINS
        value: https://agenticlogisticsystem.vercel.app

      # ---- secrets the app needs --------------------------------------------
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY_JWT
        sync: false

      # ---- email ------------------------------------------------------------
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      # ---- PayPal (sandbox) -------------------------------------------------
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox

      # ---- policy -----------------------------------------------------------
      - key: APPROVAL_THRESHOLD_INR
        value: "150000"
      - key: EMERGENCY_BUDGET_INR
        value: "500000"
      - key: MAX_TOOL_CALLS_PER_INCIDENT
        value: "25"
      - key: CLOCK_SECONDS_PER_SIM_HOUR
        value: "1"
